name: "ИИ Timeweb: что это на самом деле"

# Выяснилось, что «Облачные ИИ» у Timeweb — конструктор агентов, а не шлюз
# к моделям: в перечне методов есть создание агента, его настройки, пакеты
# токенов и статистика, но нет ни одного метода «спросить модель».
#
# Здесь дочитываем подробности, от которых зависит решение: какие модели,
# что с ценами и квотами, заведены ли уже агенты.

on:
  workflow_dispatch:

jobs:
  iskat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Подробности
        env:
          TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.timeweb.cloud"
          sprosit() { curl -s -m 30 -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$API$1"; }

          echo "=============== ЗАВЕДЁННЫЕ АГЕНТЫ =============="
          sprosit /api/v1/cloud-ai/agents | head -c 800
          echo

          echo
          echo "=============== МОДЕЛИ, ПОДРОБНО (v3) =============="
          sprosit /api/v3/cloud-ai/models > v3.json
          echo "всего: $(jq -r '.meta.total // "?"' v3.json)"
          echo
          echo "поля, которые есть у модели:"
          jq -r '[.models[0] // {} | keys[]] | join(", ")' v3.json 2>/dev/null || head -c 400 v3.json
          echo
          echo "Claude целиком:"
          jq '[.models[]? | select(.model_name | test("claude";"i"))][0]' v3.json 2>/dev/null | head -c 1200
          echo

          echo
          echo "=============== ПАКЕТЫ ТОКЕНОВ =============="
          # Ключевое для решения: это подписка с квотой или оплата по факту.
          sprosit /api/v1/cloud-ai/token-packages/agents | head -c 900
          echo
