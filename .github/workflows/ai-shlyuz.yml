name: "ИИ-шлюз Timeweb: что там есть"

# Только чтение. Выясняет, принимает ли шлюз обычный ключ Timeweb и какие
# модели он отдаёт. От ответа зависит вся схема оценки автомобилей:
# api.anthropic.com с российского сервера закрыт по региону (403), и шлюз —
# единственный способ дотянуться до модели, не возя фотографии за границу.

on:
  workflow_dispatch:

jobs:
  smotret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Отвечает ли шлюз на ключ Timeweb
        env:
          TOKEN: ${{ secrets.TIMEWEB_TOKEN }}
        run: |
          set -uo pipefail
          for URL in \
            "https://agent.timeweb.cloud/api/v1/cloud-ai/models" \
            "https://api.timeweb.cloud/api/v1/cloud-ai/models" \
            "https://agent.timeweb.cloud/api/v1/models"
          do
            KOD=$(curl -s -o otvet.json -m 30 -w '%{http_code}' \
                  -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$URL")
            printf '%-58s %s\n' "$URL" "$KOD"
            if [ "$KOD" = "200" ]; then
              echo "  --- что отдал ---"
              jq -r '..|objects|select(has("id") or has("name"))|
                     (.id // .name) + "   " + ((.description // "") | tostring)' otvet.json 2>/dev/null \
                | sort -u | head -40 || head -c 1500 otvet.json
              echo "  --- конец ---"
              exit 0
            fi
            head -c 300 otvet.json 2>/dev/null; echo
          done
          echo
          echo "Ни один адрес не принял ключ Timeweb."
          echo "Значит у шлюза свой ключ, и его надо завести в панели отдельно."
          exit 1
