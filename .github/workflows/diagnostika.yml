name: Диагностика связи

# Проверка, почему до сервера не достучаться. Выполняется целиком на машине
# GitHub: к самому серверу не подключается, только стучится и смотрит ответ.
#
# ЖУРНАЛ ПУБЛИЧНЫЙ. Адрес сервера здесь не печатается ни разу: его форма
# показывается с заменой цифр на решётки, чтобы можно было отличить IPv4 от
# IPv6 и от имени, не раскрывая значения.

on:
  workflow_dispatch:

jobs:
  proverit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Какой формы адрес
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -uo pipefail
          if [ -z "$HOST" ]; then echo "секрет SERVER_HOST пуст"; exit 1; fi
          # Цифры прячем: важна форма, а не значение.
          FORMA=$(printf '%s' "$HOST" | sed 's/[0-9]/#/g')
          echo "форма адреса:      $FORMA"
          echo "длина:             ${#HOST} знаков"
          case "$HOST" in
            *' '*|*$'\t'*) echo "ВНИМАНИЕ: внутри адреса есть пробел — скорее всего лишний" ;;
          esac
          if printf '%s' "$HOST" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "тип:               IPv4, вид правильный"
          elif printf '%s' "$HOST" | grep -q ':'; then
            echo "тип:               IPv6 — машины GitHub в IPv6 не умеют, нужен IPv4"
          else
            echo "тип:               это имя, а не адрес"
          fi
          # Частая ошибка: внутренний адрес вместо внешнего. Снаружи он
          # недостижим в принципе, и выглядит это как «таймаут».
          case "$HOST" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|100.6[4-9].*|100.[7-9][0-9].*|100.1[01][0-9].*|100.12[0-7].*)
              echo "ВНИМАНИЕ: это ВНУТРЕННИЙ адрес. Снаружи такой недостижим."
              echo "В панели Timeweb нужен адрес из строки «Публичный IP»." ;;
          esac

      - name: Отвечает ли машина вообще
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -uo pipefail
          if ping -c 3 -W 3 "$HOST" >/dev/null 2>&1; then
            echo "ping: отвечает"
          else
            echo "ping: молчит (сам по себе не приговор, многие его глушат)"
          fi

      - name: Какие порты открыты снаружи
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq netcat-openbsd >/dev/null 2>&1
          for PORT in 22 80 443 5432; do
            if nc -z -w 5 "$HOST" "$PORT" 2>/dev/null; then
              echo "порт $PORT: ОТКРЫТ"
            else
              echo "порт $PORT: закрыт или молчит"
            fi
          done
          echo
          echo "Что это значит:"
          echo "  22 открыт   — связь есть, дело в пароле или в имени пользователя."
          echo "  все закрыты — машина недостижима: не тот адрес, выключена,"
          echo "                или её закрывает межсетевой экран хостинга."
          echo "  22 закрыт, а 80 или 443 открыты — машина жива, закрыт именно SSH."
