name: "Разведка площадок: дословно"

# Третий проход. Что чиним по итогам второго:
#
# ДРОМ отдаёт страницы в кодировке windows-1251 — вышли кракозябры.
# Перекодируем. Заодно ищем настоящий адрес соглашения: три угаданных
# оказались несуществующими.
#
# АВИТО отвечает 429 машинам из дата-центров. Пробуем реже и мягче.
#
# АВТО.РУ уже прочитан: пункты 7.2.2, 7.3, 7.6 сняты дословно.

on:
  workflow_dispatch:

jobs:
  chitat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Дром и Авито
        run: |
          set -uo pipefail
          BRAUZER="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

          vzyat() {
            sleep 4
            curl -sS -L --max-time 40 --compressed -A "$BRAUZER" -H 'Accept-Language: ru-RU,ru;q=0.9' -o syroe.html -w '%{http_code}' "$1" 2>/dev/null || echo "000"
          }
          tekst() {
            # Кодировку берём из самой страницы: Дром до сих пор на windows-1251.
            if grep -qi 'charset=["'"'"']*windows-1251' syroe.html 2>/dev/null; then
              iconv -f windows-1251 -t utf-8 -c syroe.html > stranica.html 2>/dev/null || cp syroe.html stranica.html
              echo "  (перекодировано из windows-1251)"
            else
              cp syroe.html stranica.html
            fi
            perl -0777 -pe 's{<(script|style|noscript).*?</\1>}{ }gis; s{<[^>]+>}{ }gs; s{&nbsp;}{ }g; s{&amp;}{&}g; s{&quot;}{"}g; s{&laquo;}{«}g; s{&raquo;}{»}g; s{&#\d+;}{}g;' stranica.html | tr -s " \t" " " | grep -v '^ *$' > tekst.txt
          }

          echo "############ ДРОМ: API БАЗЫ ############"
          KOD=$(vzyat "https://baza.drom.ru/help/API")
          echo "ответ: $KOD"
          if [ "$KOD" = "200" ]; then
            tekst
            echo "  --- текст страницы ---"
            head -c 2500 tekst.txt | fold -w 100 -s | sed 's/^/  /'
          fi

          echo
          echo "############ ДРОМ: ГДЕ СОГЛАШЕНИЕ ############"
          KOD=$(vzyat "https://www.drom.ru/info/")
          echo "ответ на /info/: $KOD"
          if [ "$KOD" = "200" ]; then
            tekst
            echo "  ссылки, похожие на правила:"
            grep -oiE 'href="[^"]*(agreement|soglash|rules|pravila|terms|licen|usloviya)[^"]*"' stranica.html 2>/dev/null | sort -u | head -12 | sed 's/^/    /' || echo "    не нашлось"
          fi

          echo
          echo "############ ДРОМ: ПРАВИЛА ПО НАЙДЕННЫМ АДРЕСАМ ############"
          for U in \
            "https://www.drom.ru/info/terms/" \
            "https://www.drom.ru/help/agreement/" \
            "https://www.drom.ru/misc/rules/" \
            "https://baza.drom.ru/help/agreement"
          do
            KOD=$(vzyat "$U")
            echo "--- $U : $KOD"
            if [ "$KOD" = "200" ]; then
              tekst
              grep -inE 'автоматиз|робот|паук|программ|запрещ|не вправе|копирован|письменн' tekst.txt 2>/dev/null | head -8 | cut -c1-230 | sed 's/^/    /' || echo "    ничего"
            fi
          done

          echo
          echo "############ АВИТО ############"
          for U in \
            "https://www.avito.ru/robots.txt" \
            "https://www.avito.ru/legal/rules/terms-of-use" \
            "https://developers.avito.ru/api-catalog"
          do
            sleep 20
            KOD=$(vzyat "$U")
            echo "--- $U : $KOD"
            if [ "$KOD" = "200" ]; then
              tekst
              head -c 1200 tekst.txt | fold -w 100 -s | sed 's/^/    /'
            fi
          done
          echo
          echo "Если Авито снова 429 — он не пускает машины из дата-центров,"
          echo "и его условия придётся смотреть из обычного браузера."
          exit 0
